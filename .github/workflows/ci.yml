name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # O uv.lock fixa o torch do PyPI, que no Linux puxa as libs CUDA (~3 GB).
      # O CI instala o torch CPU à parte (passo abaixo), então o `uv run` dos
      # alvos do make não pode ressincronizar a .venv com o lock.
      UV_NO_SYNC: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Instalar dependências (torch CPU)
        # Mesmas versões do uv.lock, menos os pacotes CUDA; o torch vem do
        # índice CPU do PyTorch (--torch-backend cpu).
        run: |
          uv venv
          uv export --locked --all-groups --no-emit-project --no-hashes --no-annotate \
            --format requirements.txt \
            | grep -Ev '^(nvidia-|cuda-|triton)' > "$RUNNER_TEMP/requirements.txt"
          uv pip install -r "$RUNNER_TEMP/requirements.txt" --torch-backend cpu
          uv run python -c "import torch; assert not torch.version.cuda, torch.__version__; print(torch.__version__)"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-paraphrase-multilingual-MiniLM-L12-v2
      - run: make lint
      - run: make test
      - run: make eval-quick
